<!--
  PHYSICS SANDBOX — a single-file 3D physics playground.
  Rendering: Three.js (r170)   Physics: Rapier 3D (WASM, 0.14)   UI: lil-gui + custom HUD
  Everything else (terrain, textures, models, audio) is generated procedurally at runtime.
  Open this file in a modern browser (Chrome / Edge / Firefox / Safari). Internet access is needed once for the CDN libraries.

  Code layout (search for "// ====" banners):
    Core / Util · Materials · Textures · Audio · Renderer/Sky/Weather · Particles · Terrain · World (physics core)
    Kinds (shapes) · Entities · Constraints (joints, ropes, pulleys, gears) · Motors · Behaviors (parts logic)
    Systems (fluids, aero, fire, electricity, pneumatics, magnets, soft bodies, destruction, disasters, planets)
    PartsLibrary · Templates · Arena · SaveLoad · BuildTools · Cameras/Input · Inspector/Debug/Tools · Modes · UI · Main loop
-->

<script type="module">

// core.js
// ==== Core / Util ==========================================================
import * as THREE from 'three';
import { TransformControls } from 'three/addons/controls/TransformControls.js';
import { ConvexGeometry } from 'three/addons/geometries/ConvexGeometry.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';
import GUI from 'lil-gui';
import RAPIER from 'rapier';
const R = RAPIER;

const $ = (s, el = document) => el.querySelector(s);
const h = (tag, attrs = {}, ...kids) => {               // tiny DOM builder
  const e = document.createElement(tag);
  for (const k in attrs) {
    const v = attrs[k];
    if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);

  for (const c of kids.flat()) if (c !== null && c !== undefined && c !== false) e.append(c.nodeType ? c : document.createTextNode(c));

};
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, x) => { const t = clamp((x - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const DEG = Math.PI / 180;
const fmt = (v, d = 2) => (Math.abs(v) >= 1e5 ? v.toExponential(2) : v.toFixed(d));
const fmtN = v => Math.abs(v) >= 1e6 ? (v / 1e6).toFixed(2) + ' MN' : Math.abs(v) >= 1e3 ? (v / 1e3).toFixed(2) + ' kN' : v.toFixed(1) + ' N';

// Deterministic PRNG (simulation randomness must come from here, never Math.random)
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

const srange = (a, b) => a + (b - a) * srand();

const pick = (arr, rnd = srand) => arr[Math.floor(rnd() * arr.length)];

// Value noise + fBm for terrain and textures
function hash2(x, y) { let n = x * 374761393 + y * 668265263; n = (n ^ (n >> 13)) * 1274126177; return ((n ^ (n >> 16)) & 0x7fffffff) / 0x7fffffff; }
function noise2(x, y) {

  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);

function fbm(x, y, oct = 5) { let s = 0, a = 0.5, f = 1; for (let i = 0; i < oct; i++) { s += a * noise2(x * f, y * f); f *= 2.03; a *= 0.5; } return s; }

// Reusable temporaries (avoid per-frame allocations)
const _v1 = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3(), _v4 = new THREE.Vector3(), _v5 = new THREE.Vector3(), _v6 = new THREE.Vector3();
const _q1 = new THREE.Quaternion(), _q2 = new THREE.Quaternion(), _q3 = new THREE.Quaternion();
const _m4 = new THREE.Matrix4(), _c1 = new THREE.Color();
const V3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
const tv = (r, out = new THREE.Vector3()) => out.set(r.x, r.y, r.z);            // rapier vec -> THREE
const tq = (r, out = new THREE.Quaternion()) => out.set(r.x, r.y, r.z, r.w);
const rv = v => ({ x: v.x, y: v.y, z: v.z });                                   // THREE -> rapier
const rq = q => ({ x: q.x, y: q.y, z: q.z, w: q.w });
const arr3 = v => [+v.x.toFixed(5), +v.y.toFixed(5), +v.z.toFixed(5)];
const arr4 = q => [+q.x.toFixed(6), +q.y.toFixed(6), +q.z.toFixed(6), +q.w.toFixed(6)];

// Tiny event bus
const Bus = { m: {}, on(e, f) { (this.m[e] ||= []).push(f); }, emit(e, ...a) { (this.m[e] || []).forEach(f => f(...a)); } };

function toast(msg, ms = 3200) {
  const t = $('#toast'); if (!t) return;
  const d = h('div', {}, msg); t.append(d); setTimeout(() => d.remove(), ms);

}
const LS = { get(k, d) { try { const v = localStorage.getItem('psbx_' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('psbx_' + k, JSON.stringify(v)); } catch (e) { toast('Storage full or blocked'); } } };

// Symmetric 3x3 helpers for inertia tensors (row-major arrays of 9)
function sdpToMat(e, out) { // rapier SdpMatrix3 elements [m11,m12,m13,m22,m23,m33]
  out[0] = e[0]; out[1] = e[1]; out[2] = e[2]; out[3] = e[1]; out[4] = e[3]; out[5] = e[4]; out[6] = e[2]; out[7] = e[4]; out[8] = e[5]; return out;

function mat3Mul(a, b, o) { for (let i = 0; i < 3; i++) for (let j = 0; j < 3; j++) o[i * 3 + j] = a[i * 3] * b[j] + a[i * 3 + 1] * b[3 + j] + a[i * 3 + 2] * b[6 + j]; return o; }

  metal:    { name: 'Metal',    friction: 0.4,  staticF: 0.55, rest: 0.25, density: 7800, strength: Infinity, jf: 3, color: 0x9aa4ad, tex: 'metal', rough: 0.35, metal: 0.85, magnetic: true, conductive: true, snd: 'metal' },
  rubber:   { name: 'Rubber',   friction: 0.95, staticF: 1.1,  rest: 0.82, density: 1100, strength: Infinity, jf: 0.8, color: 0x2b2b2b, tex: 'rubber', rough: 0.95, metal: 0, snd: 'rubber' },

  foam:     { name: 'Foam',     friction: 0.7,  staticF: 0.8,  rest: 0.05, density: 50,   strength: Infinity, jf: 0.2, color: 0xf2e36a, tex: 'foam', rough: 1, metal: 0, snd: 'soft' },

// ==== Procedural textures ==================================================
const Tex = {
  cache: {},
  canvas(n, fn) { const c = document.createElement('canvas'); c.width = c.height = n; const g = c.getContext('2d'); fn(g, n); return c; },

// Weather: rain/snow particles around camera, storms with lightning, wind with gusts
const Weather = {
  type: 'clear', windDir: 45, windSpeed: 0, gust: 0, wind: V3(), points: null, N: 6000, t: 0, nextBolt: 5,
  init() {
    const pos = new Float32Array(this.N * 3); for (let i = 0; i < this.N; i++) pos.set([vrange(-40, 40), vrange(0, 40), vrange(-40, 40)], i * 3);
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(pos, 3));

  },
  set(type) {

    this.points.material.color.setHex(type === 'snow' ? 0xffffff : 0xaaccff); this.points.material.size = type === 'snow' ? 0.16 : 0.07;
    if (type === 'storm' && this.windSpeed < 12) this.windSpeed = 14;
    Bus.emit('weather'); toast('Weather: ' + type);
  },
  update(dt) {
    this.t += dt;
    const gustAmt = this.type === 'storm' ? 0.6 : 0.3;
    this.gust = this.windSpeed * gustAmt * (0.5 + 0.5 * noise2(this.t * 0.4, 3.3));
    const a = (this.windDir + 15 * noise2(this.t * 0.1, 8)) * DEG, sp = this.windSpeed + this.gust;
    this.wind.set(Math.cos(a) * sp, 0, Math.sin(a) * sp);

      const p = this.points.geometry.attributes.position, c = App.camera.position, snow = this.type === 'snow';
      const fall = snow ? 2.2 : 22, n = Math.floor(this.N * (this.type === 'storm' ? 1 : 0.6));
      this.points.geometry.setDrawRange(0, n);
      for (let i = 0; i < n; i++) {
        let x = p.array[i * 3], y = p.array[i * 3 + 1], z = p.array[i * 3 + 2];
        y -= fall * dt; x += this.wind.x * dt * (snow ? 0.6 : 0.25) + (snow ? Math.sin(this.t + i) * 0.01 : 0); z += this.wind.z * dt * (snow ? 0.6 : 0.25);
        if (y < c.y - 20) { y = c.y + 20 + Math.random() * 10; x = c.x + vrange(-40, 40); z = c.z + vrange(-40, 40); }
        if (x < c.x - 40) x += 80; else if (x > c.x + 40) x -= 80; if (z < c.z - 40) z += 80; else if (z > c.z + 40) z -= 80;
        p.array[i * 3] = x; p.array[i * 3 + 1] = y; p.array[i * 3 + 2] = z;

    }
  },

// ==== SaveLoad: snapshots, localStorage slots, file export/import, blueprints ====
const SaveLoad = {
  snapshot(onlyEnts) {
    const ents = onlyEnts || Entities.all.filter(e => !e.removed), set = new Set(ents.map(e => e.id));
    const inSet = id => id === null || set.has(id);
    return {
      v: 1, time: World.time, nextId: Entities.nextId,
      ents: ents.map(e => Entities.serialize(e)),
      joints: Joints.list.filter(j => set.has(j.a.id) && (!j.b || set.has(j.b.id))).map(j => Joints.serialize(j)),
      ropes: Ropes.list.filter(r => r.nodes.every(n => !n.e || set.has(n.e.id))).map(r => Ropes.serialize(r)),
      gears: Gears.list.filter(g => g.terms.every(t => set.has(t.e.id))).map(g => Gears.serialize(g)),
      links: Logic.links.filter(l => set.has(l.from) && set.has(l.to)).map(l => ({ from: l.from, to: l.to, kind: l.kind })),
      cloths: Cloth.list.filter(c => c.pins.every(p => inSet(p.e ?? null))).map(c => Cloth.serialize(c)),
      jellies: Jelly.list.filter(J => J.nodes.every(n => set.has(n.id))).map(J => Jelly.serialize(J)),
      settings: onlyEnts ? undefined : { gravity: World.gravity.y, wind: [Weather.windSpeed, Weather.windDir], weather: Weather.type, tod: App.tod },
    };
  },
  clearAll() { Fracture.q.clear(); Entities.clear(); Joints.list.slice().forEach(j => Joints.remove(j)); Joints.list.length = 0; Ropes.list.length = 0; Gears.list.length = 0; Logic.links.length = 0; Cloth.clear(); Jelly.clear(); Joints.glued.clear(); Fluids.bodies.slice().forEach((_, i) => Fluids.kill(0)); Build.deselectAll(); },
  restore(s, keepSettings = false) {
    if (!s) return; this.clearAll();
    for (const d of s.ents) Entities.create(d);
    Entities.nextId = Math.max(Entities.nextId, s.nextId || 1);
    for (const d of s.joints) Joints.deserialize(d);
    for (const d of s.ropes || []) Ropes.deserialize(d);
    for (const d of s.gears || []) Gears.deserialize(d);
    for (const l of s.links || []) Logic.add(l.from, l.to, l.kind);
    for (const d of s.cloths || []) Cloth.deserialize(d);
    for (const d of s.jellies || []) Jelly.create(V3(), d.size, d.color, d.nodes);
    if (s.settings && !keepSettings) { World.setGravity(s.settings.gravity); Weather.windSpeed = s.settings.wind?.[0] ?? 0; Weather.windDir = s.settings.wind?.[1] ?? 45; if (s.settings.weather !== Weather.type) Weather.set(s.settings.weather || 'clear'); }
    Magnets.refresh(); Bus.emit('restored');
  },
  // Paste a blueprint with fresh ids, translated so its centroid lands at `at`
  paste(bp, at, yaw = 0) {
    const idMap = {}; const c = V3(...bp.center); const q = QY(yaw);
    const created = [];
    for (const d0 of bp.ents) {
      const d = JSON.parse(JSON.stringify(d0)); const nid = Entities.nextId++; idMap[d.id] = nid; d.id = nid;
      const p = V3(...d.pos).sub(c).applyQuaternion(q).add(at); d.pos = arr3(p); d.rot = arr4(q.clone().multiply(new THREE.Quaternion(...d.rot)));
      if (d.vel) delete d.vel; if (d.angvel) delete d.angvel; if (d.group) d.group = d.group + '_' + nid;
      created.push(Entities.create(d));
    }
    // groups: remap consistently
    const gmap = {}; created.forEach(e => { if (e.group) { const base = e.group.split('_')[0]; gmap[base] ||= base + '_' + Entities.nextId; e.group = gmap[base]; } });
    for (const d of bp.joints) { const dd = { ...d }; if (dd.b === null && dd.lb) dd.lb = arr3(V3(...dd.lb).sub(c).applyQuaternion(q).add(at)); Joints.deserialize(dd, idMap); }
    for (const d of bp.ropes || []) { const dd = JSON.parse(JSON.stringify(d)); dd.nodes.forEach(n => { if (n.e === null) n.l = arr3(V3(...n.l).sub(c).applyQuaternion(q).add(at)); }); Ropes.deserialize(dd, idMap); }
    for (const d of bp.gears || []) Gears.deserialize(d, idMap);
    for (const l of bp.links || []) Logic.add(idMap[l.from], idMap[l.to], l.kind);
    for (const d of bp.cloths || []) Cloth.deserialize(d, idMap);
    for (const d of bp.jellies || []) Jelly.create(V3(), d.size, d.color, d.nodes.map(id => idMap[id]));
    Magnets.refresh(); return created;
  },
  blueprint(ents) {
    if (!ents.length) return null; const s = this.snapshot(ents); const b = new THREE.Box3(); ents.forEach(e => b.expandByPoint(e.p1));
    const c = b.getCenter(V3()); c.y = Math.min(...ents.map(e => e.p1.y - e.half.y)); s.center = arr3(c); delete s.settings; return s;
  },
  saveSlot(name) { const all = LS.get('saves', {}); all[name] = { t: Date.now(), s: this.snapshot() }; LS.set('saves', all); toast('💾 Saved "' + name + '"'); },
  loadSlot(name) { const all = LS.get('saves', {}); if (!all[name]) return toast('No save named ' + name); Undo.push(); this.restore(all[name].s); Modes.preTest = this.snapshot(); toast('📂 Loaded "' + name + '"'); },
  exportFile(obj = this.snapshot(), name = 'sandbox') { const blob = new Blob([JSON.stringify(obj)], { type: 'application/json' }); const a = h('a', { href: URL.createObjectURL(blob), download: name + '.json' }); document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); },
  importFile() {
    const inp = h('input', { type: 'file', accept: '.json,application/json' });
    inp.onchange = async () => { try { const j = JSON.parse(await inp.files[0].text()); if (j.center) { Build.clipboard = j; Build.startPaste(); toast('Blueprint loaded — click to place'); } else { Undo.push(); this.restore(j); Modes.preTest = this.snapshot(); toast('📂 Imported scene'); } } catch (e) { toast('Import failed: ' + e.message); } };
    inp.click();
  },
};
const Undo = {
  stack: [], redoStack: [], max: 40,
  push() { this.stack.push(SaveLoad.snapshot()); if (this.stack.length > this.max) this.stack.shift(); this.redoStack.length = 0; },
  undo() { if (!this.stack.length) return toast('Nothing to undo'); this.redoStack.push(SaveLoad.snapshot()); SaveLoad.restore(this.stack.pop(), true); toast('↶ Undo'); },
  redo() { if (!this.redoStack.length) return toast('Nothing to redo'); this.stack.push(SaveLoad.snapshot()); SaveLoad.restore(this.redoStack.pop(), true); toast('↷ Redo'); },
};

// main.js
// ==== Main: initialisation, system wiring, render loop =====================
const setLoad = (p, t) => { const b = $('#loadbar'), x = $('#loadtxt'); if (b) b.style.width = p + '%'; if (x) x.textContent = t; };
const nextFrame = () => new Promise(r => requestAnimationFrame(() => r()));
App.render = function () {
  const r = this.renderer, cam = this.camera;
  if (Replay.compare && Replay.ghost) { // side-by-side: live run (left) vs recorded ghost run (right)
    const W = innerWidth, H = innerHeight; r.setScissorTest(true); cam.aspect = (W / 2) / H; cam.updateProjectionMatrix();
    const gv = []; Replay.ghostMeshes.forEach(m => { gv.push([m, m.visible]); m.visible = false; });

// Housekeeping systems
const Housekeeping = {

  autoCcd() { for (const e of Entities.awake) { if (!e.dyn) continue; const v = e.body.linvel(); const s = Math.hypot(v.x, v.y, v.z); const minH = Math.min(e.half.x, e.half.y, e.half.z); if (s > 15) e.body.setSoftCcdPrediction(s * World.dt * 1.5); if (!e.ccd && s * World.dt > minH * 0.5) { e.body.enableCcd(true); e.ccd = 'auto'; } else if (e.ccd === 'auto' && s * World.dt < minH * 0.2) { e.body.enableCcd(false); e.ccd = false; } } },
};
function wireSystems() {

  World.addPre('disasters', dt => Disasters.step(dt), 2);
  World.addPre('logic', dt => Logic.pre(dt), 5);
  World.addPre('drivetrain', dt => { for (let it = 0; it < Motors.iters; it++) { Motors.pre(dt, it); Gears.pre(dt, it); } }, 20);
  World.addPre('ropes', dt => Ropes.pre(dt), 30);

  World.addPre('aero', dt => Aero.pre(dt), 41);

async function main() {

  }
